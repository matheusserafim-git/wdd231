<html lang="en">

    <meta charset="UTF-8">

    <meta property="og:description" content="Contact CodeHub Academy for questions and support.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://matheusserafim-git.github.io/wdd231/images/logo.webp">
    <meta property="og:url" content="https://matheusserafim-git.github.io/wdd231/finalproject/contact.html">

    <!-- Favicon -->
    <link rel="icon" href="images/favico.ico">

    <!-- Google Fonts (Corrigindo o erro de fontes do relatório) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- CSS Files -->
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/large.css">

    <!-- JavaScript (Observe que aqui chamamos o contact.js) -->
    <script type="module" src="scripts/contact.js" defer></script>
</head>

<body>

<header>
<img src="images/logo.webp" alt="CodeHub Academy Logo" width="50" height="50">
<h2>CodeHub Academy</h2>


<div class="header-actions">
    <button id="themeButton" aria-label="Toggle dark mode">
        🌙
    </button>

    <button id="menuButton">
        ☰
    </button>
</div>

<nav id="navigation">

<a href="index.html">Home</a>

<a href="courses.html">Courses</a>

<a href="contact.html" class="active">Contact</a>

</nav>

</header>

<main>

<section class="hero">

<h1>Contact Us</h1>

<p>Send us a message and we will get back to you.</p>

</section>

<section class="form-section">

<form method="get"
action="thankyou.html"
class="contact-form">

<div class="form-group">

<label for="fullname">Full Name</label>

<input type="text"
id="fullname"
name="fullname"
required>

</div>

<div class="form-group">

<label for="email">Email</label>

<input type="email"
id="email"
name="email"
required>

</div>

<div class="form-group">

<label for="subject">Subject</label>

<input type="text"
id="subject"
name="subject"
required>

</div>

<div class="form-group">

<label for="message">Message</label>

<textarea id="message"
name="message"
rows="6"
required></textarea>

</div>

<button type="submit" class="button">

Send Message

</button>

</form>

</section>

</main>

<footer>

<p>©2026 CodeHub Academy</p>

</footer>

</body>

</html>
