<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | CodeHub Academy</title>

<meta name="description"
content="Contact CodeHub Academy for questions and support.">

<meta name="author"
content="Matheus Serafim">

<link rel="icon" href="images/favico.ico">

<link rel="stylesheet" href="styles/small.css">
<link rel="stylesheet" href="styles/normalize.css">
<link rel="stylesheet" href="styles/large.css">

<script type="module" src="scripts/contact.js" defer></script>

</head>

<body>

<header>
<img src="images/logo.webp" alt="CodeHub Academy Logo" width="50" height="50">
<h2>CodeHub Academy</h2>


<div class="header-actions">
    <button id="themeButton" aria-label="Toggle dark mode">
        🌙
    </button>

    <button id="menuButton">
        ☰
    </button>
</div>

<nav id="navigation">

<a href="index.html">Home</a>

<a href="courses.html">Courses</a>

<a href="contact.html" class="active">Contact</a>

</nav>

</header>

<main>

<section class="hero">

<h1>Contact Us</h1>

<p>Send us a message and we will get back to you.</p>

</section>

<section class="form-section">

<form method="get"
action="thankyou.html"
class="contact-form">

<div class="form-group">

<label for="fullname">Full Name</label>

<input type="text"
id="fullname"
name="fullname"
required>

</div>

<div class="form-group">

<label for="email">Email</label>

<input type="email"
id="email"
name="email"
required>

</div>

<div class="form-group">

<label for="subject">Subject</label>

<input type="text"
id="subject"
name="subject"
required>

</div>

<div class="form-group">

<label for="message">Message</label>

<textarea id="message"
name="message"
rows="6"
required></textarea>

</div>

<button type="submit" class="button">

Send Message

</button>

</form>

</section>

</main>

<footer>

<p>©2026 CodeHub Academy</p>

</footer>

</body>

</html>
